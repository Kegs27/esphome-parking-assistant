# Additional outputs (Phase 3+)
# - Green laser (D10)
# - Status LEDs (D11, D12, D13 or WS2812B)

# Notes for Phase 1 Testing:
#
# 1. Flash via USB first: `esphome run garage-parking-assistant.yaml`
# 2. Access web server: http://garage-parking-assistant.local
# 3. Check logs for I2C detection: "Found VL53L0X at address 0x29"
# 4. Test distance readings with vehicle at multiple positions:
#    - 25 cm (minimum range)
#    - 50 cm, 75 cm, 100 cm (close range)
#    - 120 cm (default STOP distance target)
#    - 150 cm, 200 cm (long-range mode limit test)
# 5. Observe stability metrics (min/max/std-dev) for stationary vehicle
# 6. Test lost-reading detection by blocking sensor
# 7. Toggle buzzer switch to verify buzzer circuit works
#
# Success criteria:
# - Distance readings stable within ±5 cm when vehicle stationary
# - Update rate ≥4 Hz (check log timestamps)
# - Standard deviation <3 cm for stationary vehicle
# - Lost reading detected within 2 seconds
# - Buzzer activates on command
#
# Open questions to answer:
# - What is the maximum reliable range on CX-5 bumper in long-range mode?
# - Do readings vary significantly on dark vs. chrome bumper sections?
# - Is there noticeable drift over time (sensor warming up)?
# - Does ambient light (garage door open vs. closed) affect readings?
