esphome:
  name: esphome-web-2410f0
  friendly_name: parking_assistant_garage
  min_version: 2025.9.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  services:
    # Service om custom RTTTL tonen te testen
    - service: play_rtttl
      variables:
        song_str: string
      then:
        - rtttl.play:
            rtttl: !lambda 'return song_str;'

# Allow Over-The-Air updates
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Helper switches
switch:
  - platform: template
    name: "Parking Assistant Enabled"
    id: parking_assistant_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:car-brake-alert"
    
  - platform: template
    name: "Test Mode (Override garage door)"
    id: test_mode
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:test-tube"
    entity_category: config

# Configureerbare afstandszones (aanpasbaar vanuit Home Assistant)
number:
  - platform: template
    name: "Zone 1 - Geen geluid (min)"
    id: zone1_min
    min_value: 0.25
    max_value: 4.0
    step: 0.05
    unit_of_measurement: "m"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 1.20
    icon: "mdi:arrow-expand-horizontal"
    entity_category: config
    
  - platform: template
    name: "Zone 2 - Langzaam (min)"
    id: zone2_min
    min_value: 0.25
    max_value: 4.0
    step: 0.05
    unit_of_measurement: "m"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0.70
    icon: "mdi:speedometer-slow"
    entity_category: config
    
  - platform: template
    name: "Zone 3 - Medium (min)"
    id: zone3_min
    min_value: 0.25
    max_value: 4.0
    step: 0.05
    unit_of_measurement: "m"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0.45
    icon: "mdi:speedometer-medium"
    entity_category: config
    
  - platform: template
    name: "Zone 4 - Snel (min)"
    id: zone4_min
    min_value: 0.25
    max_value: 4.0
    step: 0.05
    unit_of_measurement: "m"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0.25
    icon: "mdi:speedometer"
    entity_category: config

# Garage door binary sensor from Home Assistant
binary_sensor:
  - platform: homeassistant
    entity_id: binary_sensor.garage_poort_sensor_open
    id: garagepoort

# SR04T in Mode 0 (standaard, geen modificatie nodig)
# Bereik: 25cm - 4m
sensor:
  - platform: ultrasonic
    trigger_pin: GPIO32
    echo_pin: GPIO33
    name: "Garage afstand"
    id: afstand
    update_interval: 0.25s
    pulse_time: 10us
    timeout: 4m  # 4 meter max afstand
    filters:
      - filter_out: nan
      - clamp:
          min_value: 0.25  # Minimum bereik sensor: 25cm
          max_value: 4.0   # Maximum bereik sensor: 4m
          ignore_out_of_range: true
      - median:
          window_size: 5
          send_every: 2
      - sliding_window_moving_average:
          window_size: 3
          send_every: 1
      - delta: 0.02  # Alleen publiceren als verschil > 2cm
  
  # Text sensor om huidige zone te tonen
  - platform: template
    name: "Parking Zone"
    id: parking_zone_text
    icon: "mdi:car-brake-alert"
    entity_category: diagnostic

text_sensor:
  - platform: template
    name: "Parking Zone Status"
    id: parking_zone_status
    icon: "mdi:traffic-light"
    entity_category: diagnostic

# Buzzer output op GPIO27 - LEDC voor RTTTL
output:
  - platform: ledc
    pin: GPIO27
    id: buzzer_out

# RTTTL component voor buzzer tonen
rtttl:
  output: buzzer_out
  id: buzzer_rtttl
  gain: 80%  # Volume aanpassen naar voorkeur (50-100%)

# Parking assistant logic met configureerbare zones
globals:
  - id: last_distance_zone
    type: int
    restore_value: no
    initial_value: '0'
  - id: beep_active
    type: bool
    restore_value: no
    initial_value: 'false'

interval:
  - interval: 250ms
    then:
      - lambda: |-
          // Check of systeem actief moet zijn
          // Test mode override: als test_mode AAN is, negeer garagepoort status
          bool garage_open = id(test_mode).state || id(garagepoort).state;
          
          // Alleen actief als parking assistant enabled EN (test mode OF garagepoort open)
          if (!id(parking_assistant_enabled).state || !garage_open) {
            if (id(buzzer_rtttl).is_playing()) {
              id(buzzer_rtttl).stop();
            }
            id(last_distance_zone) = 0;
            id(beep_active) = false;
            if (!id(parking_assistant_enabled).state) {
              id(parking_zone_status).publish_state("Uitgeschakeld");
            } else {
              id(parking_zone_status).publish_state("Wacht op garagepoort...");
            }
            return;
          }
          
          float d = id(afstand).state;
          
          // Geen geldige meting → buzzer uit
          if (d <= 0 || isnan(d)) {
            if (id(buzzer_rtttl).is_playing()) {
              id(buzzer_rtttl).stop();
            }
            id(last_distance_zone) = 0;
            id(beep_active) = false;
            id(parking_zone_status).publish_state("Geen meting");
            return;
          }
          
          // Haal zone drempels op uit Home Assistant entities
          float zone1_threshold = id(zone1_min).state;  // > deze waarde = geen geluid
          float zone2_threshold = id(zone2_min).state;  // > deze waarde = langzaam
          float zone3_threshold = id(zone3_min).state;  // > deze waarde = medium
          float zone4_threshold = id(zone4_min).state;  // > deze waarde = snel
          
          // Bepaal in welke zone de auto zich bevindt
          int current_zone = 0;
          std::string zone_name = "";
          
          if (d > zone1_threshold) {
            current_zone = 0;  // Geen geluid
            zone_name = "Veilig (" + to_string(d).substr(0, 4) + "m)";
          } else if (d > zone2_threshold) {
            current_zone = 1;  // Langzaam
            zone_name = "Langzaam (" + to_string(d).substr(0, 4) + "m)";
          } else if (d > zone3_threshold) {
            current_zone = 2;  // Medium
            zone_name = "Let op! (" + to_string(d).substr(0, 4) + "m)";
          } else if (d > zone4_threshold) {
            current_zone = 3;  // Snel
            zone_name = "Voorzichtig! (" + to_string(d).substr(0, 4) + "m)";
          } else {
            current_zone = 4;  // Continue toon (STOP!)
            zone_name = "STOP! (" + to_string(d).substr(0, 4) + "m)";
          }
          
          // Update zone status text sensor
          id(parking_zone_status).publish_state(zone_name);
          
          // Reset beep_active when RTTTL has finished playing so the beep can restart
          if (id(beep_active) && !id(buzzer_rtttl).is_playing()) {
            id(beep_active) = false;
          }
          
          // Als zone veranderd is of geen beep actief is, start nieuwe beep
          if (current_zone != id(last_distance_zone) || !id(beep_active)) {
            id(last_distance_zone) = current_zone;
            
            // Stop huidige beep als die er is
            if (id(buzzer_rtttl).is_playing()) {
              id(buzzer_rtttl).stop();
            }
            
            // Start nieuwe beep patroon
            switch (current_zone) {
              case 0:
                // > zone1: geen geluid
                id(beep_active) = false;
                break;
                
              case 1:
                // zone1 - zone2: langzame beep (1x per seconde)
                id(buzzer_rtttl).play("beep1:d=4,o=6,b=120:8e");
                id(beep_active) = true;
                break;
                
              case 2:
                // zone2 - zone3: snellere beep (2x per seconde)
                id(buzzer_rtttl).play("beep2:d=8,o=6,b=240:16e,16e");
                id(beep_active) = true;
                break;
                
              case 3:
                // zone3 - zone4: zeer snelle beep
                id(buzzer_rtttl).play("beep3:d=16,o=6,b=360:32e,32e,32e");
                id(beep_active) = true;
                break;
                
              case 4:
                // < zone4: continue waarschuwingstoon (STOP!)
                id(buzzer_rtttl).play("alarm:d=4,o=6,b=200:2e,2d#,2e,2d#");
                id(beep_active) = true;
                break;
            }
          }
