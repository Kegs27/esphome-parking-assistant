substitutions:
  # Maximum aantal LEDs in de strip (hardware configuratie)
  max_led_count: "60"
  # Log level: DEBUG voor ontwikkeling, INFO of WARN voor productie
  log_level: "INFO"

esphome:
  name: esphome-web-2410f0
  friendly_name: parking_assistant_garage
  min_version: 2025.9.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

# Enable logging
logger:
  level: ${log_level}

# Enable Home Assistant API
api:
  services:
    # Service om custom RTTTL tonen te testen
    - service: play_rtttl
      variables:
        song_str: string
      then:
        - rtttl.play:
            rtttl: !lambda 'return song_str;'

    # Service om de progressie balk te testen
    - service: test_progress_bar
      then:
        - light.turn_on:
            id: led_strip
            effect: "Distance Progress Bar"

# Allow Over-The-Air updates
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# WS2812B LED strip (configureerbaar aantal LEDs op GPIO26 met 330Ω resistor)
light:
  - platform: esp32_rmt_led_strip
    rgb_order: GRB
    pin: GPIO26
    num_leds: ${max_led_count}
    chipset: ws2812
    name: "Parking LED Strip"
    id: led_strip
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s
    effects:
      # Progressieve laadbalksysteem - opbouwend van groen naar rood
      - addressable_lambda:
          name: "Distance Progress Bar"
          update_interval: 50ms
          lambda: |-
            // Haal configureerbaar aantal LEDs op
            int total_leds = (int)id(led_count).state;
            // Fallback voor NaN of ongeldige waarde tijdens startup
            if (isnan(id(led_count).state) || total_leds <= 0) total_leds = it.size();
            if (total_leds > it.size()) total_leds = it.size();  // Clamp naar hardware limit
            
            // Haal huidige afstand op
            float distance = id(afstand).state;
            float max_distance = id(zone1_min).state;  // Maximum afstand (1.2m standaard)
            float min_distance = id(zone4_min).state;  // Minimum afstand (0.25m standaard)
            
            // Guard: voorkom divide-by-zero als zone configuratie ongeldig is
            if (max_distance <= min_distance) {
              // Ongeldige configuratie: toon veilige fallback (alles uit)
              it.all() = Color(0, 0, 0);
              return;
            }
            
            // Bereken hoeveel LEDs aan moeten (0-total_leds)
            int num_leds = 0;
            bool in_stop_zone = false;
            
            if (distance <= min_distance) {
              num_leds = total_leds;  // Alle LEDs aan bij minimum afstand
              in_stop_zone = true;  // STOP ZONE!
            } else if (distance >= max_distance) {
              num_leds = 0;   // Geen LEDs bij veilige afstand
            } else {
              // Lineair schalen tussen min en max
              float progress = 1.0 - ((distance - min_distance) / (max_distance - min_distance));
              num_leds = (int)(progress * (float)total_leds);
              num_leds = std::max(0, std::min(total_leds, num_leds));  // Clamp tussen 0-total_leds
            }
            
            // Blink logica
            static bool blink_state = false;
            static int blink_counter = 0;
            blink_counter++;
            if (blink_counter > 6) {  // Elke ~300ms (6 * 50ms)
              blink_state = !blink_state;
              blink_counter = 0;
            }
            
            // STOP ZONE: Hele strip rood en knipperend (alleen actieve LEDs)
            if (in_stop_zone) {
              // Eerst alle LEDs uit
              it.all() = Color(0, 0, 0);
              if (blink_state) {
                for (int i = 0; i < total_leds; i++) {
                  it[i] = Color(255, 0, 0);  // Actieve LEDs fel rood
                }
              }
              return;  // Klaar, geen verdere logica nodig
            }
            
            // Normale progressie balk logica (niet in STOP zone)
            // Als we dichtbij zijn (> 75% van LEDs), laat knipperen
            int blink_threshold = (int)(total_leds * 0.75);
            bool should_blink = num_leds > blink_threshold && !blink_state;
            
            // Alle LEDs uit
            it.all() = Color(0, 0, 0);
            
            // Teken progressie balk als we niet aan het knipperen zijn
            if (!should_blink) {
              // Bereken zone grenzen proportioneel aan totaal aantal LEDs
              int zone1_end = (int)(total_leds * 0.35);       // ~35% groen (was 7/20)
              int zone2_end = (int)(total_leds * 0.70);       // ~70% groen->oranje (was 14/20)
              
              for (int i = 0; i < num_leds && i < total_leds; i++) {
                // Bereken kleur gebaseerd op positie (proportioneel)
                // Zone 1: Groen
                // Zone 2: Groen -> Geel -> Oranje
                // Zone 3: Oranje -> Rood
                
                int r, g, b;
                if (i < zone1_end) {
                  // Groen (eerste ~35%)
                  r = 0;
                  g = 255;
                  b = 0;
                } else if (i < zone2_end) {
                  // Groen naar Oranje transitie (~35% - ~70%)
                  int zone_size = zone2_end - zone1_end;
                  float ratio = (zone_size > 0) ? (float)(i - zone1_end) / (float)zone_size : 0.0;
                  r = (int)(ratio * 255);
                  g = 255 - (int)(ratio * 100);  // Van 255 naar 155
                  b = 0;
                } else {
                  // Oranje naar Rood transitie (~70% - 100%)
                  int zone_size = total_leds - zone2_end;
                  float ratio = (zone_size > 0) ? (float)(i - zone2_end) / (float)zone_size : 0.0;
                  r = 255;
                  g = 155 - (int)(ratio * 155);  // Van 155 naar 0
                  b = 0;
                }
                
                it[i] = Color(r, g, b);
              }
            }

# Helper switches
switch:
  - platform: template
    name: "Parking Assistant Enabled"
    id: parking_assistant_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:car-brake-alert"
    
  - platform: template
    name: "Test Mode (Override garage door)"
    id: test_mode
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:test-tube"
    entity_category: config

  - platform: template
    name: "LED Strip Enabled"
    id: led_strip_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:led-strip-variant"
    on_turn_on:
      - light.turn_on: led_strip
    on_turn_off:
      - light.turn_off: led_strip

# Configureerbare afstandszones (aanpasbaar vanuit Home Assistant)
number:
  # Configureerbaar aantal LEDs
  - platform: template
    name: "LED Count"
    id: led_count
    min_value: 1
    max_value: ${max_led_count}
    step: 1
    unit_of_measurement: "LEDs"
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: ${max_led_count}
    icon: "mdi:led-strip"
    entity_category: config

  - platform: template
    name: "Zone 1 - Geen geluid (min)"
    id: zone1_min
    min_value: 0.25
    max_value: 4.0
    step: 0.05
    unit_of_measurement: "m"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 1.20
    icon: "mdi:arrow-expand-horizontal"
    entity_category: config
    
  - platform: template
    name: "Zone 2 - Langzaam (min)"
    id: zone2_min
    min_value: 0.25
    max_value: 4.0
    step: 0.05
    unit_of_measurement: "m"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0.70
    icon: "mdi:speedometer-slow"
    entity_category: config
    
  - platform: template
    name: "Zone 3 - Medium (min)"
    id: zone3_min
    min_value: 0.25
    max_value: 4.0
    step: 0.05
    unit_of_measurement: "m"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0.45
    icon: "mdi:speedometer-medium"
    entity_category: config
    
  - platform: template
    name: "Zone 4 - Snel (min)"
    id: zone4_min
    min_value: 0.25
    max_value: 4.0
    step: 0.05
    unit_of_measurement: "m"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0.25
    icon: "mdi:speedometer"
    entity_category: config

  # Configurable beep intervals per zone (in milliseconds)
  - platform: template
    name: "Zone 1 - Beep Interval"
    id: zone1_interval
    min_value: 100
    max_value: 3000
    step: 50
    unit_of_measurement: "ms"
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 1000
    icon: "mdi:timer-sand"
    entity_category: config
    
  - platform: template
    name: "Zone 2 - Beep Interval"
    id: zone2_interval
    min_value: 100
    max_value: 3000
    step: 50
    unit_of_measurement: "ms"
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 500
    icon: "mdi:timer-sand"
    entity_category: config
    
  - platform: template
    name: "Zone 3 - Beep Interval"
    id: zone3_interval
    min_value: 100
    max_value: 3000
    step: 50
    unit_of_measurement: "ms"
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 250
    icon: "mdi:timer-sand"
    entity_category: config

  # Configureerbare timeout voor parkeren voltooid detectie
  - platform: template
    name: "Parking Complete Timeout"
    id: parking_complete_timeout
    min_value: 1
    max_value: 30
    step: 1
    unit_of_measurement: "s"
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 5
    icon: "mdi:car-parking-lights"
    entity_category: config
    
# Garage door binary sensor from Home Assistant
binary_sensor:
  - platform: homeassistant
    entity_id: binary_sensor.garage_poort_sensor_open
    id: garagepoort

# JSN-SR04T in Mode 1 (100k resistor op R19 pad)
# In Mode 1: Serial output mode via UART
# Bereik: 25cm - 4m (verbeterde stabiliteit en nauwkeurigheid)
uart:
  tx_pin: GPIO32  # TX van ESP32 naar RX van sensor
  rx_pin: GPIO33  # RX van ESP32 van TX van sensor
  baud_rate: 9600

sensor:
  - platform: jsn_sr04t
    name: "Garage afstand"
    id: afstand
    update_interval: 0.25s
    filters:
      - filter_out: nan
      # Filter out maximum range readings (sensor geeft vaak 4.0m terug bij geen object)
      - lambda: |-
          if (x >= 3.95) {
            return NAN;  // Negeer metingen boven 3.95m (waarschijnlijk geen object)
          }
          return x;
      - clamp:
          min_value: 0.25  # Minimum bereik sensor: 25cm
          max_value: 4.0   # Maximum bereik sensor: 4m
          ignore_out_of_range: true
      - median:
          window_size: 5
          send_every: 2
      - sliding_window_moving_average:
          window_size: 3
          send_every: 1
      - delta: 0.02  # Alleen publiceren als verschil > 2cm
      # Timeout: als geen update in 2 seconden, reset naar 0
      - timeout:
          timeout: 2s
          value: 0.0

text_sensor:
  - platform: template
    name: "Parking Zone Status"
    id: parking_zone_status
    icon: "mdi:traffic-light"
    entity_category: diagnostic

# Configurable RTTTL beep patterns
text:
  - platform: template
    name: "Beep Pattern (Zones 1-3)"
    id: beep_pattern
    optimistic: true
    restore_value: true
    initial_value: "beep:d=4,o=6,b=100:e"
    mode: text
    icon: "mdi:music-note"
    entity_category: config
    
  - platform: template
    name: "Alarm Pattern (Zone 4 - STOP)"
    id: alarm_pattern
    optimistic: true
    restore_value: true
    initial_value: "alarm:d=4,o=6,b=100:2e,2e,2e,2e"
    mode: text
    icon: "mdi:alarm"
    entity_category: config

# Buzzer output op GPIO27 - LEDC voor RTTTL
output:
  - platform: ledc
    pin: GPIO27
    id: buzzer_out

# RTTTL component voor buzzer tonen
rtttl:
  output: buzzer_out
  id: buzzer_rtttl
  gain: 80%  # Volume aanpassen naar voorkeur (50-100%)

# Parking assistant logic met configureerbare zones
globals:
  - id: last_distance_zone
    type: int
    restore_value: no
    initial_value: '0'
  - id: last_beep_time
    type: unsigned long
    restore_value: no
    initial_value: '0'
  - id: last_distance_value
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: parking_stable_counter
    type: int
    restore_value: no
    initial_value: '0'
  - id: last_zone_status
    type: std::string
    restore_value: no
    initial_value: '""'

interval:
  # 100ms interval for responsive beeping while minimizing CPU usage
  - interval: 100ms
    then:
      - lambda: |-
          // Helper: publish status alleen als deze veranderd is
          auto publish_status = [](const std::string& status) {
            if (id(last_zone_status) != status) {
              id(last_zone_status) = status;
              id(parking_zone_status).publish_state(status);
            }
          };
          
          // Check of systeem actief moet zijn
          // Test mode override: als test_mode AAN is, negeer garagepoort status
          bool garage_open = id(test_mode).state || id(garagepoort).state;
          
          // Alleen actief als parking assistant enabled EN (test mode OF garagepoort open)
          if (!id(parking_assistant_enabled).state || !garage_open) {
            if (id(buzzer_rtttl).is_playing()) {
              id(buzzer_rtttl).stop();
            }
            // LED strip uitschakelen als systeem niet actief is
            if (id(led_strip_enabled).state && id(led_strip).current_values.is_on()) {
              auto call = id(led_strip).turn_off();
              call.perform();
            }
            id(last_distance_zone) = 0;
            id(last_beep_time) = 0;
            if (!id(parking_assistant_enabled).state) {
              publish_status("Uitgeschakeld");
            } else {
              publish_status("Wacht op garagepoort...");
            }
            return;
          }
          
          float d = id(afstand).state;
          
          // Detecteer of auto stilstaat (afstand verandert niet meer)
          // Als afstand stabiel blijft voor de geconfigureerde timeout, parkeren is voltooid
          // Bereken aantal cycli: timeout in seconden × 10 cycli per seconde (100ms interval)
          int timeout_cycles = (int)(id(parking_complete_timeout).state * 10);
          if (abs(d - id(last_distance_value)) < 0.001 && d > 0) {
            id(parking_stable_counter)++;
            if (id(parking_stable_counter) > timeout_cycles) {
              // Auto staat stil, parkeren voltooid - stop LED en geluid
              ESP_LOGI("parking", "Parking complete - distance stable at %.2fm for %ds", d, (int)id(parking_complete_timeout).state);
              if (id(buzzer_rtttl).is_playing()) {
                id(buzzer_rtttl).stop();
              }
              if (id(led_strip_enabled).state && id(led_strip).current_values.is_on()) {
                auto call = id(led_strip).turn_off();
                call.perform();
              }
              publish_status("Geparkeerd (" + to_string(d).substr(0, 4) + "m)");
              return;
            }
          } else {
            id(parking_stable_counter) = 0;
            id(last_distance_value) = d;
          }
          
          // Geen geldige meting → buzzer uit
          if (d <= 0 || isnan(d)) {
            if (id(buzzer_rtttl).is_playing()) {
              id(buzzer_rtttl).stop();
            }
            // LED strip uitschakelen bij ongeldige meting
            if (id(led_strip_enabled).state && id(led_strip).current_values.is_on()) {
              auto call = id(led_strip).turn_off();
              call.perform();
            }
            id(last_distance_zone) = 0;
            id(last_beep_time) = 0;
            publish_status("Geen meting");
            return;
          }
          
          // Haal zone drempels op uit Home Assistant entities
          float zone1_threshold = id(zone1_min).state;  // > deze waarde = geen geluid
          float zone2_threshold = id(zone2_min).state;  // > deze waarde = langzaam
          float zone3_threshold = id(zone3_min).state;  // > deze waarde = medium
          float zone4_threshold = id(zone4_min).state;  // > deze waarde = snel
          
          // Bepaal in welke zone de auto zich bevindt
          int current_zone = 0;
          std::string zone_name = "";
          unsigned long current_interval = 0;
          
          if (d > zone1_threshold) {
            current_zone = 0;  // Geen geluid
            zone_name = "Veilig (" + to_string(d).substr(0, 4) + "m)";
            current_interval = 0;
          } else if (d > zone2_threshold) {
            current_zone = 1;  // Langzaam
            zone_name = "Langzaam (" + to_string(d).substr(0, 4) + "m)";
            current_interval = (unsigned long)id(zone1_interval).state;
          } else if (d > zone3_threshold) {
            current_zone = 2;  // Medium
            zone_name = "Let op! (" + to_string(d).substr(0, 4) + "m)";
            current_interval = (unsigned long)id(zone2_interval).state;
          } else if (d > zone4_threshold) {
            current_zone = 3;  // Snel
            zone_name = "Voorzichtig! (" + to_string(d).substr(0, 4) + "m)";
            current_interval = (unsigned long)id(zone3_interval).state;
          } else {
            current_zone = 4;  // Continue toon (STOP!)
            zone_name = "STOP! (" + to_string(d).substr(0, 4) + "m)";
            // Zone 4 uses continuous beep, no interval needed
          }
          
          // Update zone status text sensor (alleen als veranderd)
          publish_status(zone_name);
          
          // LED strip: altijd progressie balk tonen als enabled
          if (id(led_strip_enabled).state && !id(led_strip).current_values.is_on()) {
            auto call = id(led_strip).turn_on();
            call.set_effect("Distance Progress Bar");
            call.perform();
          }
          
          // Detecteer zone change voor timer reset
          bool zone_changed = (current_zone != id(last_distance_zone));
          if (zone_changed) {
            id(last_beep_time) = 0;  // Reset beep timer bij zone change
            if (id(buzzer_rtttl).is_playing()) {
              id(buzzer_rtttl).stop();  // Stop huidige toon bij zone change
            }
          }
          id(last_distance_zone) = current_zone;
          
          // Zone 0 = geen geluid
          if (current_zone == 0) {
            if (id(buzzer_rtttl).is_playing()) {
              id(buzzer_rtttl).stop();
            }
            id(last_beep_time) = 0;
            return;
          }
          
          // Zone 4 = continuous alarm tone (STOP!)
          if (current_zone == 4) {
            // Play continuous alarm if not already playing
            if (!id(buzzer_rtttl).is_playing()) {
              // Use configurable alarm pattern for STOP zone
              id(buzzer_rtttl).play(id(alarm_pattern).state);
            }
            return;
          }
          
          // Zones 1-3: interval-based beeping
          // Get current time in milliseconds
          unsigned long now = millis();
          
          // Check if it's time to play a beep based on the configured interval
          bool should_beep = false;
          if (id(last_beep_time) == 0) {
            // First beep after entering a zone
            should_beep = true;
          } else if ((now - id(last_beep_time)) >= current_interval) {
            // Interval has passed, time for next beep
            should_beep = true;
          }
          
          if (should_beep && !id(buzzer_rtttl).is_playing()) {
            id(last_beep_time) = now;
            // Use configurable beep pattern for zones 1-3
            id(buzzer_rtttl).play(id(beep_pattern).state);
          }
