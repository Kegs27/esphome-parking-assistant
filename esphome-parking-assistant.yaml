esphome:
  name: esphome-web-2410f0
  friendly_name: parking_assistant_garage
  min_version: 2025.9.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  services:
    # Service om custom RTTTL tonen te testen
    - service: play_rtttl
      variables:
        song_str: string
      then:
        - rtttl.play:
            rtttl: !lambda 'return song_str;'

    # Service om LED strip effecten te testen
    - service: test_led_effect
      variables:
        effect_name: string
      then:
        - light.turn_on:
            id: led_strip
            effect: !lambda 'return effect_name;'

    # Service om specifieke zone animatie te testen
    - service: test_zone_leds
      variables:
        zone_number: int
      then:
        - lambda: |-
            std::string effect_name;
            switch(zone_number) {
              case 0: effect_name = "Zone 0 - Veilig"; break;
              case 1: effect_name = "Zone 1 - Langzaam"; break;
              case 2: effect_name = "Zone 2 - Medium"; break;
              case 3: effect_name = "Zone 3 - Voorzichtig"; break;
              case 4: effect_name = "Zone 4 - STOP"; break;
              default: effect_name = "Test - Rainbow"; break;
            }
            auto call = id(led_strip).turn_on();
            call.set_effect(effect_name);
            call.perform();

# Allow Over-The-Air updates
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# WS2812B LED strip (20 LEDs op GPIO26 met 330Ω resistor)
light:
  - platform: esp32_rmt_led_strip
    rgb_order: GRB
    pin: GPIO26
    num_leds: 20
    chipset: ws2812
    name: "Parking LED Strip"
    id: led_strip
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s
    effects:
      # Zone 0 - Veilig (geen geluid) - groen statisch
      - addressable_lambda:
          name: "Zone 0 - Veilig"
          update_interval: 50ms
          lambda: |-
            // Groen statisch - alles veilig
            it.all() = Color(0, 255, 0);

      # Zone 1 - Langzaam - groene breathing
      - addressable_lambda:
          name: "Zone 1 - Langzaam"
          update_interval: 50ms
          lambda: |-
            static uint8_t brightness = 0;
            static int8_t direction = 1;
            
            brightness += direction * 5;
            if (brightness >= 255 || brightness <= 50) {
              direction *= -1;
            }
            
            it.all() = Color(0, brightness, 0);

      # Zone 2 - Medium - gele fill animatie
      - addressable_lambda:
          name: "Zone 2 - Medium"
          update_interval: 100ms
          lambda: |-
            static int pos = 0;
            static int direction = 1;
            
            it.all() = Color(0, 0, 0);
            
            for (int i = 0; i < pos && i < it.size(); i++) {
              it[i] = Color(255, 200, 0);  // Geel/oranje
            }
            
            pos += direction;
            if (pos >= it.size() || pos <= 0) {
              direction *= -1;
            }

      # Zone 3 - Voorzichtig - oranje snel knipperen
      - addressable_lambda:
          name: "Zone 3 - Voorzichtig"
          update_interval: 150ms
          lambda: |-
            static bool on = false;
            on = !on;
            
            if (on) {
              it.all() = Color(255, 100, 0);  // Oranje
            } else {
              it.all() = Color(0, 0, 0);
            }

      # Zone 4 - STOP - rood knipperen + chase
      - addressable_lambda:
          name: "Zone 4 - STOP"
          update_interval: 75ms
          lambda: |-
            static int pos = 0;
            static bool flash = false;
            
            flash = !flash;
            
            if (flash) {
              it.all() = Color(255, 0, 0);  // Helemaal rood
            } else {
              // Rood chase effect
              it.all() = Color(50, 0, 0);  // Dim rood
              for (int i = 0; i < 3; i++) {
                int idx = (pos + i) % it.size();
                it[idx] = Color(255, 0, 0);  // Fel rood
              }
              pos = (pos + 1) % it.size();
            }

      # Test effect - rainbow
      - addressable_rainbow:
          name: "Test - Rainbow"
          speed: 10
          width: 20

      # Test effect - scanner (Knight Rider style)
      - addressable_scan:
          name: "Test - Scanner"
          move_interval: 50ms

      # Test effect - alle LEDs testen
      - addressable_lambda:
          name: "Test - LED Check"
          update_interval: 500ms
          lambda: |-
            static int led_index = 0;
            static int color_index = 0;
            
            Color colors[] = {
              Color(255, 0, 0),    // Rood
              Color(0, 255, 0),    // Groen
              Color(0, 0, 255),    // Blauw
              Color(255, 255, 255) // Wit
            };
            
            it.all() = Color(0, 0, 0);
            it[led_index] = colors[color_index];
            
            led_index++;
            if (led_index >= it.size()) {
              led_index = 0;
              color_index = (color_index + 1) % 4;
            }

# Helper switches
switch:
  - platform: template
    name: "Parking Assistant Enabled"
    id: parking_assistant_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:car-brake-alert"
    
  - platform: template
    name: "Test Mode (Override garage door)"
    id: test_mode
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:test-tube"
    entity_category: config

  - platform: template
    name: "LED Strip Enabled"
    id: led_strip_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:led-strip-variant"
    on_turn_on:
      - light.turn_on: led_strip
    on_turn_off:
      - light.turn_off: led_strip

# Configureerbare afstandszones (aanpasbaar vanuit Home Assistant)
number:
  - platform: template
    name: "Zone 1 - Geen geluid (min)"
    id: zone1_min
    min_value: 0.25
    max_value: 4.0
    step: 0.05
    unit_of_measurement: "m"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 1.20
    icon: "mdi:arrow-expand-horizontal"
    entity_category: config
    
  - platform: template
    name: "Zone 2 - Langzaam (min)"
    id: zone2_min
    min_value: 0.25
    max_value: 4.0
    step: 0.05
    unit_of_measurement: "m"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0.70
    icon: "mdi:speedometer-slow"
    entity_category: config
    
  - platform: template
    name: "Zone 3 - Medium (min)"
    id: zone3_min
    min_value: 0.25
    max_value: 4.0
    step: 0.05
    unit_of_measurement: "m"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0.45
    icon: "mdi:speedometer-medium"
    entity_category: config
    
  - platform: template
    name: "Zone 4 - Snel (min)"
    id: zone4_min
    min_value: 0.25
    max_value: 4.0
    step: 0.05
    unit_of_measurement: "m"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0.25
    icon: "mdi:speedometer"
    entity_category: config

  # Configurable beep intervals per zone (in milliseconds)
  - platform: template
    name: "Zone 1 - Beep Interval"
    id: zone1_interval
    min_value: 100
    max_value: 3000
    step: 50
    unit_of_measurement: "ms"
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 1000
    icon: "mdi:timer-sand"
    entity_category: config
    
  - platform: template
    name: "Zone 2 - Beep Interval"
    id: zone2_interval
    min_value: 100
    max_value: 3000
    step: 50
    unit_of_measurement: "ms"
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 500
    icon: "mdi:timer-sand"
    entity_category: config
    
  - platform: template
    name: "Zone 3 - Beep Interval"
    id: zone3_interval
    min_value: 100
    max_value: 3000
    step: 50
    unit_of_measurement: "ms"
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 250
    icon: "mdi:timer-sand"
    entity_category: config
    
# Garage door binary sensor from Home Assistant
binary_sensor:
  - platform: homeassistant
    entity_id: binary_sensor.garage_poort_sensor_open
    id: garagepoort

# JSN-SR04T in Mode 1 (100k resistor op R19 pad)
# In Mode 1: Serial output mode via UART
# Bereik: 25cm - 4m (verbeterde stabiliteit en nauwkeurigheid)
uart:
  tx_pin: GPIO32  # TX van ESP32 naar RX van sensor
  rx_pin: GPIO33  # RX van ESP32 van TX van sensor
  baud_rate: 9600

sensor:
  - platform: jsn_sr04t
    name: "Garage afstand"
    id: afstand
    update_interval: 0.25s
    filters:
      - filter_out: nan
      - clamp:
          min_value: 0.25  # Minimum bereik sensor: 25cm
          max_value: 4.0   # Maximum bereik sensor: 4m
          ignore_out_of_range: true
      - median:
          window_size: 5
          send_every: 2
      - sliding_window_moving_average:
          window_size: 3
          send_every: 1
      - delta: 0.02  # Alleen publiceren als verschil > 2cm
  
  # Text sensor om huidige zone te tonen
  - platform: template
    name: "Parking Zone"
    id: parking_zone_text
    icon: "mdi:car-brake-alert"
    entity_category: diagnostic

text_sensor:
  - platform: template
    name: "Parking Zone Status"
    id: parking_zone_status
    icon: "mdi:traffic-light"
    entity_category: diagnostic

# Configurable RTTTL beep patterns
text:
  - platform: template
    name: "Beep Pattern (Zones 1-3)"
    id: beep_pattern
    optimistic: true
    restore_value: true
    initial_value: "beep:d=4,o=6,b=100:e"
    mode: text
    icon: "mdi:music-note"
    entity_category: config
    
  - platform: template
    name: "Alarm Pattern (Zone 4 - STOP)"
    id: alarm_pattern
    optimistic: true
    restore_value: true
    initial_value: "alarm:d=4,o=6,b=100:2e,2e,2e,2e"
    mode: text
    icon: "mdi:alarm"
    entity_category: config

# Buzzer output op GPIO27 - LEDC voor RTTTL
output:
  - platform: ledc
    pin: GPIO27
    id: buzzer_out

# RTTTL component voor buzzer tonen
rtttl:
  output: buzzer_out
  id: buzzer_rtttl
  gain: 80%  # Volume aanpassen naar voorkeur (50-100%)

# Parking assistant logic met configureerbare zones
globals:
  - id: last_distance_zone
    type: int
    restore_value: no
    initial_value: '0'
  - id: beep_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: last_beep_time
    type: unsigned long
    restore_value: no
    initial_value: '0'

interval:
  # 100ms interval for responsive beeping while minimizing CPU usage
  - interval: 100ms
    then:
      - lambda: |-
          // Check of systeem actief moet zijn
          // Test mode override: als test_mode AAN is, negeer garagepoort status
          bool garage_open = id(test_mode).state || id(garagepoort).state;
          
          // Alleen actief als parking assistant enabled EN (test mode OF garagepoort open)
          if (!id(parking_assistant_enabled).state || !garage_open) {
            if (id(buzzer_rtttl).is_playing()) {
              id(buzzer_rtttl).stop();
            }
            // LED strip uitschakelen als systeem niet actief is
            if (id(led_strip_enabled).state && id(led_strip).current_values.is_on()) {
              auto call = id(led_strip).turn_off();
              call.perform();
            }
            id(last_distance_zone) = 0;
            id(beep_active) = false;
            id(last_beep_time) = 0;
            if (!id(parking_assistant_enabled).state) {
              id(parking_zone_status).publish_state("Uitgeschakeld");
            } else {
              id(parking_zone_status).publish_state("Wacht op garagepoort...");
            }
            return;
          }
          
          float d = id(afstand).state;
          
          // Geen geldige meting → buzzer uit
          if (d <= 0 || isnan(d)) {
            if (id(buzzer_rtttl).is_playing()) {
              id(buzzer_rtttl).stop();
            }
            // LED strip uitschakelen bij ongeldige meting
            if (id(led_strip_enabled).state && id(led_strip).current_values.is_on()) {
              auto call = id(led_strip).turn_off();
              call.perform();
            }
            id(last_distance_zone) = 0;
            id(beep_active) = false;
            id(last_beep_time) = 0;
            id(parking_zone_status).publish_state("Geen meting");
            return;
          }
          
          // Haal zone drempels op uit Home Assistant entities
          float zone1_threshold = id(zone1_min).state;  // > deze waarde = geen geluid
          float zone2_threshold = id(zone2_min).state;  // > deze waarde = langzaam
          float zone3_threshold = id(zone3_min).state;  // > deze waarde = medium
          float zone4_threshold = id(zone4_min).state;  // > deze waarde = snel
          
          // Bepaal in welke zone de auto zich bevindt
          int current_zone = 0;
          std::string zone_name = "";
          unsigned long current_interval = 0;
          
          if (d > zone1_threshold) {
            current_zone = 0;  // Geen geluid
            zone_name = "Veilig (" + to_string(d).substr(0, 4) + "m)";
            current_interval = 0;
          } else if (d > zone2_threshold) {
            current_zone = 1;  // Langzaam
            zone_name = "Langzaam (" + to_string(d).substr(0, 4) + "m)";
            current_interval = (unsigned long)id(zone1_interval).state;
          } else if (d > zone3_threshold) {
            current_zone = 2;  // Medium
            zone_name = "Let op! (" + to_string(d).substr(0, 4) + "m)";
            current_interval = (unsigned long)id(zone2_interval).state;
          } else if (d > zone4_threshold) {
            current_zone = 3;  // Snel
            zone_name = "Voorzichtig! (" + to_string(d).substr(0, 4) + "m)";
            current_interval = (unsigned long)id(zone3_interval).state;
          } else {
            current_zone = 4;  // Continue toon (STOP!)
            zone_name = "STOP! (" + to_string(d).substr(0, 4) + "m)";
            // Zone 4 uses continuous beep, no interval needed
          }
          
          // Update zone status text sensor
          id(parking_zone_status).publish_state(zone_name);
          
          // Update LED strip als zone is veranderd en LED strip is enabled
          if (id(led_strip_enabled).state && id(last_distance_zone) != current_zone) {
            std::string led_effect;
            switch(current_zone) {
              case 0: led_effect = "Zone 0 - Veilig"; break;
              case 1: led_effect = "Zone 1 - Langzaam"; break;
              case 2: led_effect = "Zone 2 - Medium"; break;
              case 3: led_effect = "Zone 3 - Voorzichtig"; break;
              case 4: led_effect = "Zone 4 - STOP"; break;
              default: led_effect = "Zone 0 - Veilig"; break;
            }
            auto call = id(led_strip).turn_on();
            call.set_effect(led_effect);
            call.perform();
          }
          
          // Update last_distance_zone
          id(last_distance_zone) = current_zone;
          
          // Zone 0 = geen geluid
          if (current_zone == 0) {
            if (id(buzzer_rtttl).is_playing()) {
              id(buzzer_rtttl).stop();
            }
            id(beep_active) = false;
            id(last_beep_time) = 0;
            return;
          }
          
          // Zone 4 = continuous alarm tone (STOP!)
          if (current_zone == 4) {
            // Play continuous alarm if not already playing
            if (!id(buzzer_rtttl).is_playing()) {
              // Use configurable alarm pattern for STOP zone
              id(buzzer_rtttl).play(id(alarm_pattern).state);
              id(beep_active) = true;
            }
            return;
          }
          
          // Zones 1-3: interval-based beeping
          // Get current time in milliseconds
          unsigned long now = millis();
          
          // Check if it's time to play a beep based on the configured interval
          bool should_beep = false;
          if (id(last_beep_time) == 0) {
            // First beep after entering a zone
            should_beep = true;
          } else if ((now - id(last_beep_time)) >= current_interval) {
            // Interval has passed, time for next beep
            should_beep = true;
          }
          
          if (should_beep && !id(buzzer_rtttl).is_playing()) {
            id(last_beep_time) = now;
            // Use configurable beep pattern for zones 1-3
            id(buzzer_rtttl).play(id(beep_pattern).state);
            id(beep_active) = true;
          }
